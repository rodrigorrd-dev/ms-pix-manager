# Tag vX.Y.Z => GitHub Release com notas geradas dos PRs (categorias em .github/release.yml).
# A imagem versionada é publicada pelo job `image` do ci.yml (que também roda em tags v*).
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cria a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && echo "Release já existe (criada pelo release-please)." || gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
