# Versionamento automático: a cada push na main o release-please lê os Conventional Commits, calcula a próxima versão
# (feat => minor, fix/perf => patch, "!" ou BREAKING CHANGE => major; antes da 1.0 o breaking vira minor), abre/atualiza o PR
# "chore(main): release X.Y.Z" (CHANGELOG + versão do pom.xml) e, quando esse PR é mergeado, cria a tag vX.Y.Z e a GitHub Release.
# O PR de release recebe o label "automerge": o workflow automerge.yml liga o auto-merge e o merge sai quando os checks passam.
# Secret AUTOMERGE_TOKEN (PAT com repo) é necessário para que o PR de release dispare os checks e a tag dispare a imagem versionada:
# eventos criados pelo GITHUB_TOKEN não disparam outros workflows.
name: release-please
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
