# Publica README.md, subida-producao.md e docs/**/*.md na Wiki do GitHub a cada push na main.
# A fonte da verdade é o repositório; a Wiki é gerada por scripts/build-wiki.py e edições feitas direto nela são sobrescritas.
name: wiki
on:
  push:
    branches: [main]
    paths: ['README.md', 'subida-producao.md', 'docs/**/*.md', 'scripts/build-wiki.py', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Clona a Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.wiki.git" "$RUNNER_TEMP/wiki"
      - name: Gera as páginas
        run: python3 scripts/build-wiki.py "$RUNNER_TEMP/wiki" "${{ github.repository }}" main
      - name: Publica se houve mudança
        working-directory: ${{ runner.temp }}/wiki
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki já está atualizada."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sincroniza com ${GITHUB_SHA::7}"
          git push
