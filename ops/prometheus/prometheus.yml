global: { scrape_interval: 15s, evaluation_interval: 15s }
rule_files: [/etc/prometheus/alert-rules.yml]
scrape_configs:
  - job_name: ms-pix-manager
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ['app:8080'] }]   # app no compose; se rodar na IDE, troque por host.docker.internal:<SERVER_PORT>
  - job_name: kafka-exporter
    static_configs: [{ targets: ['kafka-exporter:9308'] }]
  - job_name: kafka-connect-jmx                                    # requer jmx-exporter no Connect (backlog de infra)
    static_configs: [{ targets: ['kafka-connect:9404'] }]
