# STATUS: contrato ALVO (spec-first). Inclui rotas ainda não implementadas (med-cases, scheduled-payments, automatic-authorizations,
# webhook-deliveries, reports) e não lista algumas já implementadas (POST /v1/payment-orders/decodings, PUT /v1/limits/accounts/{id}/{scope}).
# A fonte da verdade do que está NO AR é GET /v3/api-docs (springdoc) e docs/postman. Veja o README, 'Artefatos'.
openapi: 3.0.3
info:
  title: ms-pix-manager — API de gestão
  version: 1.0.0
  description: |
    Superfície de gestão (`/v1`). A superfície compatível com o BCB (`/api/pix/v2`) segue literalmente
    `contracts/bcb/api-pix-openapi-2.10.0.yaml`.
servers:
  - url: https://pix.example.com
security:
  - OAuth2: []
tags:
  - name: pix-keys
  - name: key-claims
  - name: payment-orders
  - name: limits
  - name: med-cases
  - name: reports
  - name: scheduled-payments
  - name: automatic-authorizations
  - name: webhooks
paths:
  /v1/pix-keys:
    post:
      tags: [pix-keys]
      operationId: registerPixKey
      summary: Registrar chave Pix (CPF, CNPJ, PHONE, EMAIL, EVP)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterPixKeyRequest' }
      responses:
        '201':
          description: Chave criada (PENDING_DICT / PENDING_OWNERSHIP_PROOF)
          headers:
            Location: { schema: { type: string } }
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PixKeyResponse' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      tags: [pix-keys]
      operationId: listPixKeys
      summary: Listar chaves do titular (paginado)
      parameters:
        - { name: accountId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PixKeyStatus' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Página de chaves
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PixKeyPage' }
  /v1/pix-keys/{id}:
    get:
      tags: [pix-keys]
      operationId: getPixKey
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200':
          description: Chave
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PixKeyResponse' }
        '304': { description: Não modificada }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/pix-keys/{id}/deletion:
    post:
      tags: [pix-keys]
      operationId: deletePixKey
      summary: Excluir chave (transição; sem DELETE com corpo)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { $ref: '#/components/schemas/KeyDeletionReason' }
      responses:
        '200':
          description: Exclusão solicitada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PixKeyResponse' }
        '412': { $ref: '#/components/responses/Problem' }
        '428': { $ref: '#/components/responses/Problem' }
  /v1/pix-keys/lookups:
    post:
      tags: [pix-keys]
      operationId: lookupPixKey
      summary: 'Consultar chave de terceiro no DICT (POST porque o valor da chave é PII e não vai na URL)'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pixKeyType, pixKey]
              properties:
                pixKeyType: { $ref: '#/components/schemas/PixKeyType' }
                pixKey: { type: string, maxLength: 77 }
      responses:
        '200':
          description: Dados públicos do vínculo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PixKeyLookupResponse' }
        '404': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/payment-orders:
    post:
      tags: [payment-orders]
      operationId: createPaymentOrder
      summary: Criar ordem de pagamento Pix
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentOrderRequest' }
      responses:
        '201':
          description: Ordem criada
          headers:
            Location: { schema: { type: string } }
            ETag: { schema: { type: string } }
            Idempotent-Replayed: { schema: { type: boolean } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOrderResponse' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    get:
      tags: [payment-orders]
      operationId: listPaymentOrders
      parameters:
        - { name: payerAccountId, in: query, required: true, schema: { type: string, format: uuid } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Página de ordens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOrderPage' }
  /v1/payment-orders/{id}:
    get:
      tags: [payment-orders]
      operationId: getPaymentOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Ordem
          headers: { ETag: { schema: { type: string } } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOrderResponse' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/payment-orders/{id}/cancellation:
    post:
      tags: [payment-orders]
      operationId: cancelPaymentOrder
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Cancelada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentOrderResponse' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/limits/accounts/{accountId}:
    get:
      tags: [limits]
      operationId: getLimits
      parameters:
        - { name: accountId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Limites vigentes e pendentes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LimitsResponse' }
  /v1/med-cases:
    post:
      tags: [med-cases]
      operationId: openMedCase
      summary: Notificar infração (MED)
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenMedCaseRequest' }
      responses:
        '201':
          description: Caso aberto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MedCaseResponse' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/scheduled-payments:
    post:
      tags: [scheduled-payments]
      operationId: createScheduledPayment
      summary: Agendar Pix (único ou recorrente)
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKeyRequired' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateScheduledPaymentRequest' }
      responses:
        '201':
          description: Agendamento criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledPaymentResponse' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/scheduled-payments/{id}/cancellation:
    post:
      tags: [scheduled-payments]
      operationId: cancelScheduledPayment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Cancelado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledPaymentResponse' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/automatic-authorizations/{id}/acceptance:
    post:
      tags: [automatic-authorizations]
      operationId: acceptAutomaticAuthorization
      summary: Aceitar autorização de Pix Automático (opcionalmente limitando o valor)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payerMaxAmount: { $ref: '#/components/schemas/Money' }
      responses:
        '200':
          description: Autorização aprovada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomaticAuthorizationResponse' }
        '422': { $ref: '#/components/responses/Problem' }
  /v1/automatic-authorizations/{id}/rejection:
    post:
      tags: [automatic-authorizations]
      operationId: rejectAutomaticAuthorization
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, enum: [AP13, AP14, AP15] }
      responses:
        '200':
          description: Autorização rejeitada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AutomaticAuthorizationResponse' }
  /v1/webhook-deliveries/{id}/resend:
    post:
      tags: [webhooks]
      operationId: resendWebhookDelivery
      summary: Reenvio manual de entrega em estado DEAD
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: Reenvio enfileirado
        '422': { $ref: '#/components/responses/Problem' }
  /v1/med-cases/{id}/contestations:
    post:
      tags: [med-cases]
      operationId: contestMedRefund
      summary: Contestar devolução MED (até 80 dias da devolução)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refundId, reason]
              properties:
                refundId: { type: string, format: uuid }
                reason: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Contestação aberta
        '422': { $ref: '#/components/responses/Problem' }
  /v1/reports/reconciliation:
    get:
      tags: [reports]
      operationId: reconciliationReport
      summary: Conciliação diária (dia em America/Sao_Paulo)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Linhas por dia/status
          content:
            application/json:
              schema:
                type: array
                maxItems: 366
                items: { $ref: '#/components/schemas/ReconciliationRow' }
components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://idp.example.com/oauth/token
          scopes:
            pixkey.read: Consultar chaves
            pixkey.write: Gerir chaves e reivindicações
            payment.read: Consultar ordens
            payment.write: Criar/cancelar ordens
            limit.read: Consultar limites
            limit.write: Alterar limites
            med.read: Consultar casos MED
            med.write: Operar casos MED
            report.read: Relatórios
            pii.document.read: Ver CPF/CNPJ completo (padrão é mascarado; auditado)
            schedule.read: Consultar agendamentos
            schedule.write: Criar/cancelar agendamentos
            automatic.read: Consultar autorizações de Pix Automático
            automatic.write: Aceitar/rejeitar/cancelar autorizações
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, maxLength: 255 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Versão esperada do agregado (ETag). Ausente → 428; desatualizada → 412.
      schema: { type: string }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  responses:
    Problem:
      description: Erro (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code, timestamp]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, pattern: '^PIX-[0-9]{3}-[0-9]{3}$' }
        timestamp: { type: string, format: date-time }
        traceId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              code: { type: string }
              message: { type: string }
    Money:
      type: string
      pattern: '^\d{1,10}\.\d{2}$'
      example: '123.45'
    Cpf:
      type: string
      description: 11 dígitos (com ou sem máscara). Validação com dígito verificador. Retornado mascarado salvo escopo pii.document.read.
      pattern: '^(\d{11}|\d{3}\.\d{3}\.\d{3}-\d{2})$'
      example: '529.982.247-25'
    PixKeyType:
      type: string
      enum: [CPF, CNPJ, PHONE, EMAIL, EVP]
    PixKeyStatus:
      type: string
      enum: [PENDING_OWNERSHIP_PROOF, PENDING_DICT, ACTIVE, PORTABILITY_REQUESTED, OWNERSHIP_CLAIMED, REJECTED, DELETED]
    KeyDeletionReason:
      type: string
      enum: [USER_REQUESTED, ACCOUNT_CLOSURE, BRANCH_TRANSFER, RECONCILIATION, FRAUD, DEFAULT_OPERATION]
    RegisterPixKeyRequest:
      type: object
      required: [accountId, pixKeyType]
      properties:
        accountId: { type: string, format: uuid }
        pixKeyType: { $ref: '#/components/schemas/PixKeyType' }
        pixKey:
          type: string
          maxLength: 77
          description: Obrigatório exceto para EVP (gerado pelo DICT). CPF/CNPJ devem igualar o titular (RN-KEY-02).
    PixKeyResponse:
      type: object
      required: [id, accountId, pixKeyType, pixKeyMasked, status]
      properties:
        id: { type: string, format: uuid }
        accountId: { type: string, format: uuid }
        pixKeyType: { $ref: '#/components/schemas/PixKeyType' }
        pixKeyMasked: { type: string }
        status: { $ref: '#/components/schemas/PixKeyStatus' }
        createdAt: { type: string, format: date-time }
    PixKeyPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/PixKeyResponse' }
    PixKeyLookupResponse:
      type: object
      properties:
        pixKeyType: { $ref: '#/components/schemas/PixKeyType' }
        ownerName: { type: string }
        ownerDocumentMasked: { type: string }
        ispb: { type: string, pattern: '^\d{8}$' }
        branch: { type: string }
        accountType: { type: string, enum: [CACC, SVGS, TRAN, SLRY] }
        keyOwnershipDate: { type: string, format: date-time }
    PageEnvelope:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content: { type: array, items: {} }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    CreatePaymentOrderRequest:
      type: object
      required: [payerAccountId, method, amount]
      properties:
        payerAccountId: { type: string, format: uuid }
        method: { type: string, enum: [KEY, MANUAL, QR_STATIC, QR_DYNAMIC] }
        amount: { $ref: '#/components/schemas/Money' }
        payerMessage: { type: string, maxLength: 140 }
        destination:
          type: object
          properties:
            pixKeyType: { $ref: '#/components/schemas/PixKeyType' }
            pixKey: { type: string, maxLength: 77 }
            documentHint: { $ref: '#/components/schemas/Cpf' }
            ispb: { type: string, pattern: '^\d{8}$' }
            branch: { type: string }
            account: { type: string }
            accountType: { type: string, enum: [CACC, SVGS, TRAN, SLRY] }
            name: { type: string, maxLength: 200 }
        qrPayload: { type: string, maxLength: 4096 }
    PaymentOrderResponse:
      type: object
      required: [id, status, amount]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [CREATED, VALIDATED, RESERVED, SENT_TO_SPI, SETTLED, REJECTED, FAILED_TECHNICAL, CANCELLED]
        amount: { $ref: '#/components/schemas/Money' }
        endToEndId: { type: string, minLength: 32, maxLength: 32, nullable: true }
        rejectReasonCode: { type: string, nullable: true }
        requestedAt: { type: string, format: date-time }
    PaymentOrderPage:
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            content:
              type: array
              items: { $ref: '#/components/schemas/PaymentOrderResponse' }
    LimitsResponse:
      type: object
      properties:
        accountId: { type: string, format: uuid }
        limits:
          type: array
          items:
            type: object
            properties:
              scope: { type: string, enum: [PER_TRANSACTION, DAILY, NIGHTLY, NEW_PAYEE, DEVICE_UNREGISTERED_PER_TX, DEVICE_UNREGISTERED_DAILY] }
              ceilingAmount: { $ref: '#/components/schemas/Money' }
              amount: { $ref: '#/components/schemas/Money' }
              pendingAmount: { $ref: '#/components/schemas/Money' }
              pendingEffectiveAt: { type: string, format: date-time }
    OpenMedCaseRequest:
      type: object
      required: [endToEndId, caseType, description]
      properties:
        layer: { type: integer, minimum: 1, default: 1, description: Camada do rastreamento (MED 2.0) }
        endToEndId: { type: string, minLength: 32, maxLength: 32 }
        caseType: { type: string, enum: [FRAUD, OPERATIONAL_FAILURE] }
        description: { type: string, maxLength: 2000 }
    MedCaseResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, ACCEPTED, REFUNDING, CLOSED, REFUSED, CANCELLED] }
        endToEndId: { type: string }
        analysisDeadlineAt: { type: string, format: date-time }
    CreateScheduledPaymentRequest:
      type: object
      required: [payerAccountId, method, amount, recurrence, firstDate]
      properties:
        payerAccountId: { type: string, format: uuid }
        method: { type: string, enum: [KEY, MANUAL, QR_STATIC, QR_DYNAMIC] }
        amount: { $ref: '#/components/schemas/Money' }
        recurrence:
          type: string
          enum: [ONCE, WEEKLY, BIWEEKLY, MONTHLY, BIMONTHLY, QUARTERLY, SEMIANNUAL, ANNUAL]
        firstDate: { type: string, format: date, description: Dia em America/Sao_Paulo }
        endDate: { type: string, format: date }
        occurrencesTotal: { type: integer, minimum: 1 }
        payerMessage: { type: string, maxLength: 140 }
        destination: { type: object }
    ScheduledPaymentResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [ACTIVE, COMPLETED, CANCELLED] }
        recurrence: { type: string }
        nextDueDate: { type: string, format: date }
    AutomaticAuthorizationResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        idRec: { type: string, minLength: 29, maxLength: 29 }
        status: { type: string, enum: [CRIADA, APROVADA, REJEITADA, EXPIRADA, CANCELADA] }
        requestStatus: { type: string, enum: [CRIADA, ENVIADA, RECEBIDA, REJEITADA, ACEITA, EXPIRADA, CANCELADA] }
        periodicity: { type: string, enum: [SEMANAL, MENSAL, TRIMESTRAL, SEMESTRAL, ANUAL] }
        receiverDocumentMasked: { type: string }
        receiverName: { type: string }
        payerMaxAmount: { $ref: '#/components/schemas/Money' }
    ReconciliationRow:
      type: object
      properties:
        day: { type: string, format: date }
        reconciliationStatus: { type: string, enum: [NO_CHARGE, MATCHED, MATCHED_AFTER_EXPIRATION, MISMATCH] }
        receivedCount: { type: integer, format: int64 }
        receivedAmount: { $ref: '#/components/schemas/Money' }
